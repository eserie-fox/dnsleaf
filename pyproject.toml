[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsleaf"
dynamic = ["version"]
description = "Lightweight workspace-driven Cloudflare DDNS for dynamic and static IP targets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eserie-fox" }]
keywords = ["ddns", "cloudflare", "proxmox", "systemd", "ipv6"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
  "types-PyYAML>=6.0,<7.0",
  "twine>=6.0,<7.0",
]

[project.urls]
Repository = "https://github.com/eserie-fox/dnsleaf"
Issues = "https://github.com/eserie-fox/dnsleaf/issues"
Changelog = "https://github.com/eserie-fox/dnsleaf/blob/main/CHANGELOG.md"

[project.scripts]
dnsleaf = "dnsleaf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["dnsleaf", "dnsleaf.*"]
namespaces = false

[tool.setuptools.package-data]
dnsleaf = ["config_defaults/*.json", "templates/*.json", "templates/*.txt"]

[tool.setuptools.dynamic]
version = {attr = "dnsleaf.version.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dnsleaf", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=dnsleaf --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
