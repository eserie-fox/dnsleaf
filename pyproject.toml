[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "arbor-ddns"
version = "0.1.0"
description = "Lightweight centralized IPv6 discovery and DNS AAAA synchronization for PVE guests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" },
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
arbor-ddns = "arbor_ddns.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arbor_ddns"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/docs/**/*.md",
  "/src/arbor_ddns/**/*.py",
  "/src/arbor_ddns/config_defaults/*.json",
  "/tests/**/*.py",
  "/pyproject.toml",
  "/.python-version",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "--cov=arbor_ddns --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["arbor_ddns"]
pretty = true
show_error_codes = true
